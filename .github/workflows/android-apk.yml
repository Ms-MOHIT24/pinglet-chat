name: Build Pinglet Android APK

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "server.js"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

concurrency:
  group: pinglet-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check server.js && node --check public/app.js


      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install app dependencies
        run: npm install

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build installable APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Pinglet Android Preview
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
