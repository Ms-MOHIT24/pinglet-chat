name: Bootstrap Pinglet 2.0 lockfile

on:
  push:
    branches:
      - release/pinglet-2.0-engineering-stability-2026-11-08

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate lockfile from package.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean deterministic install
        run: npm ci --no-audit --no-fund
      - name: Check server syntax
        run: node --check server.js
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is already up to date."
            exit 0
          fi
          git commit -m "build: add reproducible npm lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"
